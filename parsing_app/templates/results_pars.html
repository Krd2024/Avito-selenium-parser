{% extends 'index.html' %}
{% block content %}
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      text-align: center;
      padding: 50px;
    }

    h1 {
      color: #333;
    }

    .form-search-results {
      background: white;
      padding: 25px;
      width: 50%;
      margin: auto;
      border-radius: 8px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
      text-align: left;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 12px;
      color: #555;
    }

    .form-control {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .form-control:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 3px rgba(0, 123, 255, 0.3);
    }

    hr {
      border: 0;
      height: 1px;
      background: #ddd;
      margin: 20px 0;
    }

    .btn-primary {
      background-color: #007bff;
      color: white;
      padding: 12px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
      display: block;
      width: 100%;
      font-size: 16px;
      margin-top: 20px;
    }

    .btn-primary:hover {
      background-color: #0056b3;
    }

    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
  </style>

  <body>
    <h1>Поиск результатов</h1>

    {% if errors %}
      <div style="width: 40%; margin: 0 auto 15px; padding: 12px; background: #f8d7da; color: #842029; border-radius: 5px; text-align: left;">
        <ul style="margin: 0; padding-left: 20px;">
          {% for error in errors %}
            <li>{{ error }}</li>
          {% endfor %}
        </ul>
      </div>
    {% endif %}

    <form action="{% url 'search' %}" method="post" class="form-search-results">
      {% csrf_token %}

      <label for="request_id">Выберите поисковый запрос:</label>
      <select name="request_id" id="request_id" class="form-control">
        <option value="">— Выберите запрос —</option>
        {% for req in all_requests %}
          <option value="{{ req.id }}">
            #{{ req.id }}: {{ req.search_phrase }} ({{ req.sity }})
          </option>
        {% endfor %}
      </select>
      <div class="hint">Или введите ID вручную:</div>
      <input type="text" name="request_id_text" id="request_id_text" class="form-control" placeholder="ID запроса" style="margin-top: 8px;" oninput="document.getElementById('request_id').value = this.value" />

      <hr />

      <label for="start_data">Начало периода (необязательно):</label>
      <input type="datetime-local" name="start_data" id="start_data" class="form-control" />

      <label for="stop_data">Конец периода (необязательно):</label>
      <input type="datetime-local" name="stop_data" id="stop_data" class="form-control" />

      <button type="submit" class="btn-primary">Посмотреть</button>
    </form>
  </body>
{% endblock %}
