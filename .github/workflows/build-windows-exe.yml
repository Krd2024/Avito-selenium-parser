name: Build Windows exe

# PyInstaller не умеет кросс-компиляцию, поэтому .exe собирается на
# windows-runner'е. Готовый файл прикладывается к запуску как артефакт
# (и к релизу, если workflow запущен по тегу).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r windows/requirements-build.txt

      - name: Collect static
        run: python manage.py collectstatic --noinput --clear

      - name: Build exe
        run: pyinstaller windows/avito_parser.spec --noconfirm --clean

      - name: Smoke test
        shell: pwsh
        run: |
          # Приложение блокирует консоль (это сервер), поэтому запускаем
          # фоном и проверяем, что интерфейс отвечает.
          $proc = Start-Process -FilePath dist\AvitoParser.exe `
            -ArgumentList "--no-browser","--port","8765" -PassThru
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest "http://127.0.0.1:8765/" -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "Приложение не ответило на http://127.0.0.1:8765/" }
            Write-Host "OK: интерфейс отвечает"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: AvitoParser-windows
          path: dist/AvitoParser.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AvitoParser.exe
