services:
  db:
    image: mysql:8
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"

    # Без healthcheck приложение стартовало раньше готовности MySQL
    # и падало на `manage.py migrate` («Can't connect to MySQL server»).
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umyuser", "-pmypassword"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build: .
    container_name: django_app
    restart: always
    depends_on:
      db:
        condition: service_healthy

    environment:
      # В контейнере работаем с MySQL (локально по умолчанию SQLite).
      DB_ENGINE: mysql
      DB_NAME: mydatabase
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_HOST: db
      DB_PORT: "3306"
      PARSE_INTERVAL_MINUTES: "60"
      # Прокси и ротация (обход блокировок Авито). Список прокси — в файле
      # proxies.txt в корне репозитория (монтируется через .:/app).
      # Формат см. в proxies.txt.example. Пример:
      # PROXY_LIST: "185.204.0.1:8000,185.204.0.2:8000:user:pass"
      PROXY_ROTATION: "round_robin"
      PARSE_PROXY_ATTEMPTS: "3"

    # required: false — без этого `docker compose up` падал, если .env
    # не создан (файл не хранится в репозитории).
    env_file:
      - path: .env
        required: false

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    # Контейнеру нужен большой /dev/shm, иначе Chromium падает.
    shm_size: "2gb"

    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py runserver 0.0.0.0:8000
      "

volumes:
  mysql_data:
